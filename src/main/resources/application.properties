spring.application.name=hrms-leave-service

#mysql
spring.datasource.url=jdbc:mysql://localhost:3306/hrms_leave?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#hibernaet
# ddl-auto=update is fine for a take-home; a real project would use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

#health
management.endpoints.web.exposure.include=health
