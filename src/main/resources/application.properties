spring.application.name=hrms-leave-service

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/hrms_leave?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto=update is fine for a take-home; a real project would use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Seed data (test users) ---
# Runs after schema is created/updated. See data.sql for the seeded users.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# --- Actuator (used only for the unauthenticated health check) ---
management.endpoints.web.exposure.include=health
